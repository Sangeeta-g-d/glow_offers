<article class="card{% if pinned %} card--pinned{% endif %}">
  <a class="card-img" href="{{ offer.link }}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true">
    <img src="{{ offer.image.url }}" alt="" loading="lazy">
    {% if pinned %}<span class="pin-badge">&#128204; Pinned</span>{% endif %}
  </a>
  <div class="card-body">
    <h3>{{ offer.title }}</h3>
    {% if offer.description %}<p>{{ offer.description|linebreaksbr }}</p>{% endif %}
    <a class="btn btn--small" href="{{ offer.link }}" target="_blank" rel="noopener noreferrer">Grab this offer</a>
  </div>
</article>
